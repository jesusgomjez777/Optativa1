{% extends "tienda/base.html" %}

{% block title %} Producto {% endblock %}

{% block content %}
<h1>¡Producto!</h1>
<p> 
<a href="{% url 'tienda:crear_producto' %}"class="btn primary"> Nuevo producto</a>
</p>
<ul>
    {% for p in productos %}
    <li>
        <a href="{% url 'tienda:detalle_producto' p.pk %}"class="btn primary">{{p.nombre}}</a>
        - ${{ p.precio|floatformat:2 }}
    </li>
    {%endfor%}
</ul>
{% endblock %}
