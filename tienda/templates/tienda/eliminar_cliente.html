{% extends "tienda/base.html" %}

{% block title %} Eliminar: {{producto.nombre}} {% endblock %}

{% block content %}
<h1> Eliminar cliente</h1>
<p>¿estas seguro de querer eliminar <strong> {{ cliente.nombre}}
</strong>?</p>

<form method="post">  
    {% csrf_token %}
    <button type="summit" class="btn delate">Si, eliminar</button>
    <a href="{% url 'tienda:detalle_cliente' cliente.pk %}"class="btn delate">Cancelar</a>
</form>

{% endblock %}
